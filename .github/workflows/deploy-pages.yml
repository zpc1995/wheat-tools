name: Deploy to GitHub Pages

# Builds the production bundle and publishes it to GitHub Pages.
# The app uses hash routing, so no server-side SPA fallback is required.
on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Least privilege: read the repo, write to Pages, and mint the OIDC token
# that actions/deploy-pages uses to authenticate.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; queue instead of cancelling so a
# half-finished publish cannot leave the site in a broken state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # No VITE_BASE override: vite.config.ts uses a relative base ("./"), so
        # one build serves both the custom domain root and the
        # /<repo>/ project sub-path correctly.
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
