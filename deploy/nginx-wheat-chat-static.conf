# wheat.chat → 直接托管静态文件（推荐给国内访问）
#
# 与 nginx-wheat-chat.conf 的区别：
#   那份是「反向代理到 GitHub Pages」——请求仍然要出国，国内访问依然不稳定。
#   这份是「把构建产物直接放在自己服务器上」——流量不出境，国内访问稳定。
#
# 前置：把 dist/ 的内容上传到服务器，例如
#   rsync -av --delete dist/ <部署用户>@<服务器地址>:<网站根目录>/
#
# 安装：
#   cp nginx-wheat-chat-static.conf /etc/nginx/conf.d/wheat.chat.conf
#   nginx -t && systemctl reload nginx
#
# 之后：
#   - 仓库仍用 GitHub 做版本管理与 CI 构建
#   - 可以只把 dist/ 上传到这台服务器（不必让 GitHub Actions 直接部署）

server {
    listen 80;
    listen [::]:80;
    server_name wheat.chat www.wheat.chat;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wheat.chat www.wheat.chat;

    ssl_certificate     /etc/nginx/ssl/wheat.chat.pem;
    ssl_certificate_key /etc/nginx/ssl/wheat.chat.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    root /path/to/site;
    index index.html;

    # 构建产物带内容哈希，可长期强缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML 不缓存，保证发新版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 应用使用 hash 路由，正常不会产生其它路径的请求；
    # 仍保留回退，避免直接访问子路径时 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态服务器上开启压缩收益明显（GitHub Pages 是自动压缩的）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # 可选：若把 favicon / CNAME 之外的根文件也放上来，无需额外配置
}
