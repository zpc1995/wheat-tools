# wheat.chat → GitHub Pages 反向代理
#
# 适用场景：你已有一台 nginx 服务器持有 wheat.chat 的 A/AAAA 记录，希望保留它
# （继续持有该服务器的 IP），同时把内容换成麦工具。
#
# 安装：
#   cp nginx-wheat-chat.conf /etc/nginx/conf.d/wheat.chat.conf
#   nginx -t && systemctl reload nginx
#
# 前置条件（顺序重要，否则 GitHub 会拒绝提供页面）：
#   1. 仓库 Settings → Pages → Custom domain 填 wheat.chat 并保存
#   2. 再应用本配置
#   3. 等 GitHub 签发证书后，在 Pages 设置里勾选 Enforce HTTPS
#
# 为什么用 SNI 直连而不是 proxy_pass https://wheat.chat：
#   后者会让 nginx 解析 wheat.chat → 解析回自己 → 无限循环。

# 动态解析 GitHub Pages 的地址，GitHub 换 IP 时无需改配置。
# 只有「变量 + resolver」的写法才会在运行时解析；upstream 块是启动时解析。
resolver 223.5.5.5 119.29.29.29 valid=300s;
resolver_timeout 5s;

# ---------------------------------------------------------------------------
# HTTP：放行 ACME 验证，其余跳 HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name wheat.chat www.wheat.chat;

    # certbot --webroot 需要读到该目录，必须放在 301 之前
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS：反代 GitHub Pages
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wheat.chat www.wheat.chat;

    # 替换为你自己的证书（certbot 签发，或阿里云免费证书）
    ssl_certificate     /etc/nginx/ssl/wheat.chat.pem;
    ssl_certificate_key /etc/nginx/ssl/wheat.chat.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上游证书属于 *.github.io，因此 SNI 用 github.io，并跳过主机名校验
    proxy_ssl_server_name on;
    proxy_ssl_name github.io;

    # 静态资源体积不大，直接缓冲整段响应
    proxy_buffering on;
    proxy_buffers 8 16k;
    proxy_buffer_size 16k;

    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # 上游已是 CDN，压缩由它完成，这层不再二次压缩
    gzip off;

    # 公共的转发头，抽到 server 级避免每个 location 重复
    proxy_set_header Host              wheat.chat;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_redirect off;

    # 变量形式的 proxy_pass 必须带 URI（结尾的 /），否则路径会拼接错误。
    # $github_upstream 在运行时由 resolver 解析。
    set $github_upstream "185.199.108.153";

    location / {
        # Host 必须是 wheat.chat：GitHub Pages 依据 Host 判断提供哪个站点，
        # 若为默认的 $proxy_host 会拿到 GitHub 首页或 404。
        proxy_pass https://$github_upstream/;
    }

    # 构建产物带内容哈希，可长期强缓存
    location /assets/ {
        proxy_pass https://$github_upstream;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML 不缓存，保证发新版后能被立即取到
    location = /index.html {
        proxy_pass https://$github_upstream;
        add_header Cache-Control "no-cache";
    }

    location = /favicon.svg {
        proxy_pass https://$github_upstream;
        expires 7d;
    }
}
